services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis_server:6379
      - SERVER_ADDR=:8080
    volumes:
      - app_uploads:/app/upload
      - app_process_job:/app/processJobs
        
volumes:
  app_uploads:
  app_process_job:
